<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="FID Push - Firebase Installation ID notifications">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/><stop offset="0.55" stop-color="#2a1458"/><stop offset="1" stop-color="#0e5a78"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a00"/><stop offset="1" stop-color="#ffd54a"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7c5cff" stop-opacity=".7"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="930" cy="210" r="260" fill="url(#glow)"><animate attributeName="r" values="230;270;230" dur="5s" repeatCount="indefinite"/></circle>
  <g fill="none" stroke="#9fd8ff" stroke-opacity=".5" stroke-width="2">
    <circle cx="930" cy="210" r="90"><animate attributeName="r" values="90;230" dur="3.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".6;0" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="210" r="90"><animate attributeName="r" values="90;230" dur="3.6s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".6;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(930 210)">
    <rect x="-70" y="-70" width="140" height="140" rx="36" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".35"/>
    <path d="M-28 34 L-18 -38 L-4 -12 L8 -30 L28 34 L0 46 Z" fill="url(#flame)"/>
    <g><animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="2.4s" repeatCount="indefinite"/>
      <circle cx="46" cy="-46" r="14" fill="#ff4d6d"/></g>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#fff">
    <text x="80" y="170" font-size="26" fill="#9fd8ff" letter-spacing="6">FIREBASE INSTALLATION ID</text>
    <text x="80" y="250" font-size="76" font-weight="800">FID Push</text>
    <text x="80" y="300" font-size="26" fill="#d6d9ff">Token-free notifications for Flutter, Android &amp; iOS</text>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#fff">
    <rect x="80" y="335" width="110" height="36" rx="18" fill="#fff" fill-opacity=".14"/><text x="104" y="359">Flutter</text>
    <rect x="202" y="335" width="130" height="36" rx="18" fill="#fff" fill-opacity=".14"/><text x="226" y="359">Firebase</text>
    <rect x="344" y="335" width="150" height="36" rx="18" fill="#fff" fill-opacity=".14"/><text x="368" y="359">Python Admin</text>
  </g>
</svg>
