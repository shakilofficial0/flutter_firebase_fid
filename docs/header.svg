<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Flutter Firebase FID Push Notification">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/><stop offset="0.55" stop-color="#2a1458"/><stop offset="1" stop-color="#0e5a78"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a00"/><stop offset="1" stop-color="#ffd54a"/>
    </linearGradient>
    <linearGradient id="pyBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a9fd4"/><stop offset="1" stop-color="#306998"/>
    </linearGradient>
    <linearGradient id="pyYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe873"/><stop offset="1" stop-color="#ffd43b"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7c5cff" stop-opacity=".7"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="930" cy="210" r="260" fill="url(#glow)"><animate attributeName="r" values="230;270;230" dur="5s" repeatCount="indefinite"/></circle>
  <g fill="none" stroke="#9fd8ff" stroke-width="2">
    <circle cx="930" cy="210" r="90"><animate attributeName="r" values="90;230" dur="3.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".6;0" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="210" r="90"><animate attributeName="r" values="90;230" dur="3.6s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".6;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(930 210)">
    <rect x="-70" y="-70" width="140" height="140" rx="36" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".35"/>
    <path d="M-28 34 L-18 -38 L-4 -12 L8 -30 L28 34 L0 46 Z" fill="url(#flame)"/>
    <circle cx="46" cy="-46" r="14" fill="#ff4d6d"><animate attributeName="r" values="14;17;14" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#fff">
    <text x="80" y="120" font-size="22" fill="#9fd8ff" letter-spacing="6">FIREBASE INSTALLATION ID</text>
    <text x="80" y="198" font-size="56" font-weight="800">Flutter Firebase FID</text>
    <text x="80" y="260" font-size="56" font-weight="800">Push Notification</text>
    <text x="80" y="300" font-size="22" fill="#d6d9ff">Token-free notifications for Android &amp; iOS, tested with Python</text>
  </g>

  <!-- Tech badges -->
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#fff">
    <!-- Flutter -->
    <rect x="80" y="330" width="150" height="56" rx="28" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".2"/>
    <g transform="translate(98 341) scale(.34)">
      <path d="M58 0H100L38 62L17 41Z" fill="#54c5f8"/>
      <path d="M58 42H100L79 63H37Z" fill="#54c5f8"/>
      <path d="M37 63H79L58 84L38 100L17 84Z" fill="#01579b"/>
      <path d="M38 100L58 84L79 63L58 84Z" fill="#29b6f6"/>
    </g>
    <text x="140" y="365">Flutter</text>
    <!-- Firebase -->
    <rect x="244" y="330" width="160" height="56" rx="28" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".2"/>
    <g transform="translate(262 339)">
      <path d="M2 30L8 2Q9.5 -1 11 2L16 12L12 19Z" fill="#ffa000"/>
      <path d="M2 30L12 19L16 12L19 18Z" fill="#f57c00"/>
      <path d="M2 30L20 38L36 30L28 4Q27 1 25.5 4L12 19Z" fill="#ffca28" transform="scale(.9) translate(1 0)"/>
      <path d="M2 30L12 19L20 28Z" fill="#ff6f00" opacity=".7"/>
    </g>
    <text x="306" y="365">Firebase</text>
    <!-- Python -->
    <rect x="418" y="330" width="150" height="56" rx="28" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".2"/>
    <g transform="translate(436 341) scale(.34)">
      <path d="M50 0C20 0 22 13 22 13V27H51V31H10S0 30 0 52S9 74 9 74H25V63S24 54 33 54H62S72 54 72 45V15S73 0 50 0ZM36 8A5 5 0 1 1 36 18A5 5 0 1 1 36 8Z" fill="url(#pyBlue)"/>
      <path d="M52 100C82 100 80 87 80 87V73H51V69H92S102 70 102 48S93 26 93 26H77V37S78 46 69 46H40S30 46 30 55V85S29 100 52 100ZM66 92A5 5 0 1 1 66 82A5 5 0 1 1 66 92Z" fill="url(#pyYellow)"/>
    </g>
    <text x="482" y="365">Python</text>
  </g>
</svg>
